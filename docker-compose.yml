name: polaristraining
services:
  app:
    image: node
    working_dir: /app
    restart: always
    ports:
      - 3718:3000
    volumes:
      - ./app:/app
    entrypoint:
      [
        "sh",
        "-c",
        "echo 'PWD='$(pwd) && echo 'Files in current directory:' && ls -la && chmod +x ./entrypoint.sh && ./entrypoint.sh",
      ]
